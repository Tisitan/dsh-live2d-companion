<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>游戏中心</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #fff; }
  /* 卫星窗形态：卡片铺满窗口，拖动走 IPC moveBy（app-region 不可靠且吞点击）。
     注意：inset:0 之后绝不能再写 top/right:auto——会把 shorthand 拆成左下锚定，
     窗口顶部/右侧露出 BODY 裸区（光标在卡缘疯狂跳变的血案现场） */
  #l2d-game { inset: 0 !important; border-radius: 0 !important; box-shadow: none !important; }
  /* 头部光标用 move 而非 grab/grabbing：grab 小手在 NOACTIVATE+GPU 合成窗口上有
     已知的图像闪烁病（Chromium 老坑），move 十字是系统原生光标，永不闪 */
  #l2d-game .l2d-game-head { cursor: move !important; }
  /* 头部是整条拖动把手：禁用 chip（当前游戏）不做指针孤岛，手势统一 */
  #l2d-game .l2d-game-head .l2d-game-chip:disabled { cursor: move !important; }
  #l2d-game .l2d-game-head:active, #l2d-game .l2d-game-head .l2d-game-chip:disabled:active { cursor: move !important; }
</style>
<script>window.__l2dCardWin = true</script>
</head>
<body>
<script type="module" src="/live2d/game-card.js"></script>
</body>
</html>
